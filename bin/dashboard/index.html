<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microworld Dashboard</title>
  <style>
    body { font-family: system-ui; margin: 2rem; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #222; }
    .empty-state { padding: 2rem; background: #f5f5f5; border-radius: 4px; }
    .code { font-family: monospace; background: #eee; padding: 0.2rem 0.4rem; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Microworld Dashboard</h1>
    <div id="app"></div>
  </div>
  <script>
    async function loadBundles() {
      try {
        const token = new URLSearchParams(location.search).get('t');
        const response = await fetch('/api/bundles', {
          headers: token ? { 'X-Antislop-Token': token } : {},
        });
        if (!response.ok) {
          document.getElementById('app').innerHTML =
            '<div class="empty-state"><p>Error loading bundles (HTTP ' +
            response.status + ')</p></div>';
          return;
        }
        const bundles = await response.json();
        if (!bundles || bundles.length === 0) {
          document.getElementById('app').innerHTML =
            '<div class="empty-state">' +
            '<p>No bundles found. Microworlds appear in ' +
            '<span class="code">microworlds/&lt;unit-slug&gt;/manifest.json</span> ' +
            'when agents author them.</p>' +
            '</div>';
          return;
        }
        const html = bundles.map(b =>
          '<div style="margin: 1rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 4px;">' +
          '<h3>' + (b.disabled ? '⚠ ' : '') + b.unit + '</h3>' +
          '<p>' + b.description + '</p>' +
          (b.disabledReason ? '<p style="color: #d32f2f;"><strong>Disabled:</strong> ' + b.disabledReason + '</p>' : '') +
          '</div>'
        ).join('');
        document.getElementById('app').innerHTML = html;
      } catch (err) {
        document.getElementById('app').innerHTML =
          '<div class="empty-state"><p>Error: ' + err.message + '</p></div>';
      }
    }
    loadBundles();
  </script>
</body>
</html>
