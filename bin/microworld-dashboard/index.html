<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microworld Dashboard</title>
  <style>
    :root {
      --gvx-bg-dim: #1d2021;
      --gvx-bg: #282828;
      --gvx-bg-soft: #32302f;
      --gvx-fg: #d4be98;
      --gvx-fg-bright: #ddc7a1;
      --gvx-gray: #928374;
      --gvx-red: #ea6962;
      --gvx-green: #a9b665;
      --gvx-yellow: #d8a657;
      --gvx-blue: #7daea3;
      --gvx-purple: #d3869b;
      --gvx-aqua: #89b482;
      --gvx-orange: #e78a4e;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --radius-card: 8px;
      --radius-chip: 6px;
      --radius-pill: 22px;
    }
    * { box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', 'Cascadia Code', ui-monospace, Consolas, monospace; letter-spacing: 0.01em; margin: 0; color: var(--gvx-fg); background: var(--gvx-bg-dim); color-scheme: dark; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .container { display: flex; height: 100vh; }
    .left-rail { width: 280px; background: var(--gvx-bg); border-right: 1px solid var(--gvx-bg-soft); overflow-y: auto; }
    .main-content { flex: 1; display: flex; flex-direction: column; }
    .header { padding: var(--space-4); border-bottom: 1px solid var(--gvx-bg-soft); background: var(--gvx-bg); }
    h1 { margin: 0; font-size: 1.5rem; }
    .bundle-item { padding: var(--space-4); border-bottom: 1px solid var(--gvx-bg-soft); cursor: pointer; }
    .bundle-item:hover { background: var(--gvx-bg-soft); }
    .bundle-item.active { background: var(--gvx-bg-soft); border-left: 3px solid var(--gvx-blue); }
    .status-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: var(--space-2); }
    .status-pass { background: var(--gvx-green); }
    .status-fail { background: var(--gvx-red); }
    .status-timeout { background: var(--gvx-orange); }
    .status-unknown { background: var(--gvx-gray); }
    .bundle-title { font-weight: 500; }
    .bundle-desc { font-size: 0.85rem; color: var(--gvx-gray); margin-top: var(--space-1); }
    .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; height: 100%; }
    .empty-state-text { max-width: 500px; }
    .code { background: var(--gvx-bg-soft); padding: var(--space-1) var(--space-2); border-radius: var(--radius-chip); }
    .tabs-container { background: var(--gvx-bg); border-bottom: 1px solid var(--gvx-bg-soft); padding: 0; overflow-x: auto; display: flex; }
    .tab-button { padding: var(--space-3) var(--space-4); border: none; background: none; cursor: pointer; font-size: 0.95rem; color: var(--gvx-gray); border-bottom: 2px solid transparent; }
    .tab-button:hover { background: var(--gvx-bg-soft); }
    .tab-button.active { color: var(--gvx-blue); border-bottom-color: var(--gvx-blue); }
    .form-and-output { flex: 1; display: flex; overflow: hidden; }
    .form-pane { width: 1000px; border-right: 1px solid var(--gvx-bg-soft); overflow-y: auto; padding: var(--space-6); background: var(--gvx-bg); }
    .output-pane { flex: 1; overflow-y: auto; padding: var(--space-6); background: var(--gvx-bg-dim); font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; }
    .form-group { margin-bottom: var(--space-6); }
    label { display: block; font-weight: 500; margin-bottom: var(--space-2); }
    label .desc { display: block; font-size: 0.85rem; font-weight: normal; color: var(--gvx-gray); margin-top: var(--space-1); }
    input[type="text"], input[type="number"], textarea { width: 100%; padding: var(--space-2); border: 1px solid var(--gvx-bg-soft); border-radius: var(--radius-chip); background: var(--gvx-bg); color: var(--gvx-fg); font: inherit; }
    textarea { resize: vertical; min-height: 80px; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus { outline: none; border-color: var(--gvx-blue); }
    :focus-visible { outline: 2px solid var(--gvx-yellow); outline-offset: 2px; }
    .submit-btn { background: var(--gvx-blue); color: var(--gvx-bg); border: none; padding: var(--space-3) var(--space-6); border-radius: var(--radius-pill); cursor: pointer; font-weight: 600; }
    .submit-btn:hover { filter: brightness(1.08); }
    .submit-btn:disabled { background: var(--gvx-gray); color: var(--gvx-bg); cursor: not-allowed; }
    .output-section { margin-bottom: var(--space-4); }
    .output-label { color: var(--gvx-gray); font-weight: 500; margin-bottom: var(--space-2); }
    .banner { padding: var(--space-3); border-left: 3px solid; margin-bottom: var(--space-4); background: var(--gvx-bg); }
    .banner-timeout { border-color: var(--gvx-orange); color: var(--gvx-orange); }
    .banner-truncated { border-color: var(--gvx-blue); color: var(--gvx-blue); }
    .exit-code { font-weight: 500; }
    .spinner { display: inline-block; }
    @media (prefers-reduced-motion: no-preference) {
      .spinner { animation: spin 1s linear infinite; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .no-functions { color: var(--gvx-gray); font-style: italic; padding: var(--space-4); }
    .excerpt-pane { border: 1px solid var(--gvx-bg-soft); border-radius: var(--radius-chip); background: var(--gvx-bg-dim); padding: var(--space-3); margin-bottom: var(--space-6); max-height: 200px; overflow-y: auto; font-size: 0.85rem; }
    .excerpt-line { white-space: pre-wrap; word-break: break-all; }
    .doc-pane { border: 1px solid var(--gvx-bg-soft); border-radius: var(--radius-chip); background: var(--gvx-bg-dim); padding: var(--space-3); margin-bottom: var(--space-6); overflow-y: auto; font-size: 0.85rem; word-break: normal; font-family: inherit; }
    .comment-section { margin-bottom: var(--space-6); }
    .comment-section label { margin-bottom: var(--space-2); font-weight: 500; }
    .comment-box { width: 100%; padding: var(--space-2); border: 1px solid var(--gvx-bg-soft); border-radius: var(--radius-chip); font: inherit; resize: vertical; min-height: 60px; background: var(--gvx-bg); color: var(--gvx-fg); }
    .comment-box:focus { outline: none; border-color: var(--gvx-blue); }
    .copy-btn { background: var(--gvx-green); color: var(--gvx-bg); border: none; padding: var(--space-3) var(--space-4); border-radius: var(--radius-pill); cursor: pointer; font-weight: 500; margin-top: var(--space-2); width: 100%; margin-bottom: var(--space-6); }
    .copy-btn:hover { filter: brightness(1.08); }
    .copy-feedback { margin-bottom: var(--space-4); padding: var(--space-2); background: var(--gvx-bg); border: 1px solid var(--gvx-green); border-radius: var(--radius-chip); color: var(--gvx-green); display: none; }
    .hidden-textarea { position: absolute; left: -9999px; width: 1px; height: 1px; }
    .bundle-section-header { padding: var(--space-3) var(--space-4); background: var(--gvx-bg-dim); font-weight: 600; font-size: 0.85rem; color: var(--gvx-gray); border-bottom: 1px solid var(--gvx-bg-soft); text-transform: uppercase; letter-spacing: 0.5px; }
    .pill-option-group { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-4); }
    .pill-option { background: var(--gvx-bg); color: var(--gvx-fg); border: 1px solid var(--gvx-bg-soft); padding: var(--space-3) var(--space-4); border-radius: var(--radius-pill); cursor: pointer; font-weight: 500; transition: all 0.2s ease; }
    .pill-option:hover { filter: brightness(1.08); }
    .pill-option.checked { background: var(--gvx-green); color: var(--gvx-bg); }
    .pill-option.checked::after { content: ' ✓'; }

  </style>
</head>
<body>
  <div class="container">
    <div class="left-rail" id="leftRail"></div>
    <div class="main-content">
      <div class="header">
        <h1>Microworld Dashboard</h1>
      </div>
      <div class="content-area" id="contentArea"></div>
    </div>
  </div>

  <!-- Injected verbatim by server.js's GET / handler from feedback-block.js
       (the pure formatter also required directly by tests/dashboard-feedback.test.js).
       This is the ONE implementation of the feedback block shape; the module
       script below calls the resulting page-global `formatFeedbackBlock` by
       name rather than reimplementing the markdown shape inline. -->
  <script>/* __FEEDBACK_BLOCK_SOURCE__ */</script>

  <!-- Injected verbatim by server.js's GET / handler from decision-block.js
       (the pure composer also required directly by
       tests/dashboard-decision-block.test.js). Composes command/block text
       only; the module script below calls the resulting page-global
       `composeDecisionBlock` by name. -->
  <script>/* __DECISION_BLOCK_SOURCE__ */</script>

  <!-- Injected verbatim by server.js's GET / handler from markdown-lite.js
       (the pure renderer also required directly by
       tests/dashboard-markdown-lite.test.js). Renders markdown as HTML
       for document panes; the module script below calls the resulting
       page-global `renderMarkdown` by name. -->
  <script>/* __MARKDOWN_LITE_SOURCE__ */</script>

  <script type="module">
    const token = new URLSearchParams(location.search).get('t');
    let bundles = [];
    let selectedBundle = null;
    let selectedFunction = null;
    let selectedGroup = null;
    let fetchError = null;
    let cellsByFunctionId = {}; // Notebook: cells per function (persists across tab switches)
    let nextCellId = 0; // Auto-incrementing cell ID for uniqueness

    // Decisions section state (gh353). decisions is the /api/decisions
    // payload: { escalations, briefings, findings, pendingReview }.
    // selectedDecisionView is { kind, key } for one of the four touchpoints,
    // mutually exclusive with selectedBundle.
    let decisions = null;
    let decisionsError = null;
    let selectedDecisionView = null;
    let defaultBy = '';
    let escalationForm = { route: 'approve', reason: '', by: '', quiz: 'skipped' };
    let pendingReviewForm = { reason: '' };

    async function fetchBundles() {
      const response = await fetch('/api/bundles', {
        headers: token ? { 'X-Antislop-Token': token } : {},
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return await response.json();
    }

    async function refreshBundles() {
      try {
        bundles = await fetchBundles();
        fetchError = null;
      } catch (err) {
        console.error('Error fetching bundles:', err);
        fetchError = err.message;
      }
    }

    async function fetchDecisions() {
      const response = await fetch('/api/decisions', {
        headers: token ? { 'X-Antislop-Token': token } : {},
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return await response.json();
    }

    async function refreshDecisions() {
      try {
        const data = await fetchDecisions();
        // Normalize defensively: a malformed or unexpectedly-shaped response
        // (e.g. an older server, or a test fixture that doesn't model this
        // endpoint) degrades to "nothing to show" rather than crashing render.
        decisions = {
          escalations: Array.isArray(data && data.escalations) ? data.escalations : [],
          briefings: Array.isArray(data && data.briefings) ? data.briefings : [],
          findings: Array.isArray(data && data.findings) ? data.findings : [],
          pendingReview: Array.isArray(data && data.pendingReview) ? data.pendingReview : [],
        };
        decisionsError = null;
      } catch (err) {
        console.error('Error fetching decisions:', err);
        decisionsError = err.message;
      }
    }

    function decisionsHasAnyGroup() {
      if (!decisions) return false;
      return decisions.escalations.length > 0
        || decisions.briefings.length > 0
        || decisions.findings.length > 0
        || decisions.pendingReview.length > 0;
    }

    function getStatusClass(status) {
      if (!status) return 'status-unknown';
      if (status.result === 'pass') return 'status-pass';
      if (status.result === 'fail') return 'status-fail';
      if (status.result === 'timeout') return 'status-timeout';
      return 'status-unknown';
    }

    function renderLeftRail() {
      const rail = document.getElementById('leftRail');
      const hasDecisions = decisionsHasAnyGroup();

      if (bundles.length === 0 && !hasDecisions) {
        rail.innerHTML = fetchError
          ? `<div style="padding: var(--space-4); color: var(--gvx-red);">Error loading microworld bundles: ${escapeHtml(fetchError)}</div>`
          : '<div style="padding: var(--space-4); color: var(--gvx-gray);">No microworld bundles</div>';
        return;
      }

      const workingBundles = bundles.filter(b => b.source === 'working');
      const packetBundles = bundles.filter(b => b.source === 'packet');

      let html = '';

      // Review section: escalations, packet bundles, findings, pending review
      const reviewCount = (decisions?.escalations?.length || 0) + packetBundles.length + (decisions?.findings?.length || 0) + (decisions?.pendingReview?.length || 0);
      if (reviewCount > 0) {
        html += `<div class="bundle-section-header">Review (${reviewCount})</div>`;

        // Escalations
        if (decisions && decisions.escalations) {
          html += decisions.escalations.map((e) => `
            <div class="bundle-item decision-item ${isSelectedDecision('escalation', e.taskId) ? 'active' : ''}" data-decision-kind="escalation" data-decision-key="${escapeHtml(e.taskId)}">
              <div class="bundle-title">Escalation: ${escapeHtml(e.taskId)}</div>
            </div>
          `).join('');
        }

        // Packet bundles
        html += packetBundles.map((b) => `
          <div class="bundle-item ${selectedBundle?.id === b.id ? 'active' : ''}" data-bundle-id="${escapeHtml(b.id)}">
            <div>
              <span class="status-indicator ${getStatusClass(b.status)}"></span>
              <span class="bundle-title">Packet: ${escapeHtml(b.unit)}</span>
            </div>
            <div class="bundle-desc">${escapeHtml(b.description || '(no description)')}</div>
          </div>
        `).join('');

        // Findings
        if (decisions && decisions.findings) {
          html += decisions.findings.map((f) => `
            <div class="bundle-item decision-item ${isSelectedDecision('findings', f.slug) ? 'active' : ''}" data-decision-kind="findings" data-decision-key="${escapeHtml(f.slug)}">
              <div class="bundle-title">Findings: ${escapeHtml(f.slug)}</div>
            </div>
          `).join('');
        }

        // Pending review
        if (decisions && decisions.pendingReview) {
          html += decisions.pendingReview.map((p) => `
            <div class="bundle-item decision-item ${isSelectedDecision('pending-review', p.agentId) ? 'active' : ''}" data-decision-kind="pending-review" data-decision-key="${escapeHtml(p.agentId)}">
              <div class="bundle-title">Pending review: ${escapeHtml(p.unit || p.agentId)}</div>
            </div>
          `).join('');
        }
      }

      // Plans & Specs section: briefings
      const briefingsCount = decisions?.briefings?.length || 0;
      if (briefingsCount > 0) {
        html += `<div class="bundle-section-header">Plans & Specs (${briefingsCount})</div>`;
        html += decisions.briefings.map((b) => `
          <div class="bundle-item decision-item ${isSelectedDecision('briefing', b.path) ? 'active' : ''}" data-decision-kind="briefing" data-decision-key="${escapeHtml(b.path)}">
            <div class="bundle-title">${escapeHtml(b.heading || b.path)}</div>
          </div>
        `).join('');
      }

      // Microworlds section: working bundles
      if (workingBundles.length > 0) {
        html += `<div class="bundle-section-header">Microworlds (${workingBundles.length})</div>`;
        html += workingBundles.map((b) => `
          <div class="bundle-item ${selectedBundle?.id === b.id ? 'active' : ''}" data-bundle-id="${escapeHtml(b.id)}">
            <div>
              <span class="status-indicator ${getStatusClass(b.status)}"></span>
              <span class="bundle-title">${escapeHtml(b.unit)}</span>
            </div>
            <div class="bundle-desc">${escapeHtml(b.description || '(no description)')}</div>
          </div>
        `).join('');
      }

      rail.innerHTML = html;

      rail.querySelectorAll('.bundle-item').forEach(item => {
        item.addEventListener('click', () => {
          const bundleId = item.getAttribute('data-bundle-id');
          if (bundleId) {
            selectedBundle = bundles.find(b => b.id === bundleId);
            selectedFunction = null;
            selectedGroup = null;
            selectedDecisionView = null;
            render();
          }
        });
      });

      rail.querySelectorAll('.decision-item').forEach(item => {
        item.addEventListener('click', () => {
          const kind = item.getAttribute('data-decision-kind');
          const key = item.getAttribute('data-decision-key');
          selectDecisionView(kind, key);
        });
      });
    }

    function isSelectedDecision(kind, key) {
      return !!selectedDecisionView && selectedDecisionView.kind === kind && selectedDecisionView.key === key;
    }

    function resetDecisionForms() {
      escalationForm = { route: 'approve', reason: '', by: defaultBy, quiz: 'skipped' };
      pendingReviewForm = { reason: '' };
    }

    function selectDecisionView(kind, key) {
      selectedBundle = null;
      selectedFunction = null;
      selectedDecisionView = { kind, key };
      resetDecisionForms();
      render();
    }

    function renderContent() {
      const content = document.getElementById('contentArea');

      if (selectedDecisionView) {
        content.innerHTML = renderDecisionViewHtml();
        attachDecisionViewListeners();
        return;
      }

      if (!selectedBundle) {
        if (bundles.length === 0) {
          content.innerHTML = fetchError
            ? `<div class="empty-state"><div class="empty-state-text">
                <p style="color: var(--gvx-red);">Could not load microworld bundles: ${escapeHtml(fetchError)}</p>
              </div></div>`
            : `<div class="empty-state"><div class="empty-state-text">
                <p>No microworld bundles yet.</p>
                <p style="font-size: 0.9rem; color: var(--gvx-gray);">
                  A microworld bundle is a working-tree directory under
                  <span class="code">microworlds/&lt;unit-slug&gt;/</span> with a
                  <span class="code">manifest.json</span> and a <span class="code">run.sh</span> check,
                  authored by an agent while implementing a unit.
                </p>
              </div></div>`;
        } else {
          content.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-text">
                <p>Select a microworld from the left panel to begin.</p>
              </div>
            </div>
          `;
        }
        return;
      }

      if (!selectedBundle.functions || selectedBundle.functions.length === 0) {
        content.innerHTML = `
          <div style="padding: var(--space-6); background: var(--gvx-bg);">
            <h2>${escapeHtml(selectedBundle.unit)}</h2>
            <p>${escapeHtml(selectedBundle.description)}</p>
            <div class="no-functions">No function entries declared in this bundle's manifest.</div>
          </div>
        `;
        return;
      }

      const groups = {};
      for (const fn of selectedBundle.functions) {
        const grp = fn.group || 'Ungrouped';
        if (!groups[grp]) groups[grp] = [];
        groups[grp].push(fn);
      }
      const groupNames = Object.keys(groups);
      if (!selectedGroup || !groups[selectedGroup]) {
        selectedGroup = groupNames[0];
      }

      let html = `<div class="tabs-container">`;
      for (const groupName of groupNames) {
        const isActive = groupName === selectedGroup;
        html += `<button class="tab-button ${isActive ? 'active' : ''}" data-group-name="${escapeHtml(groupName)}">${escapeHtml(groupName)}</button>`;
      }
      html += `</div>`;

      html += `<div class="tabs-container">`;
      for (const fn of groups[selectedGroup]) {
        const isActive = selectedFunction?.id === fn.id;
        html += `<button class="tab-button ${isActive ? 'active' : ''}" data-fn-id="${escapeHtml(fn.id)}">
          ${escapeHtml(fn.label || fn.id)}
        </button>`;
      }
      html += `</div>`;

      if (selectedFunction) {
        const fn = selectedFunction;
        const inputs = fn.inputs || [];

        html += `<div class="form-and-output">`;
        html += `<div class="form-pane">`;
        html += `<h3>${escapeHtml(fn.label || fn.id)}</h3>`;
        html += `<p>${escapeHtml(fn.description || '')}</p>`;

        // Excerpt pane (if location exists)
        if (fn.location && fn.location.file) {
          html += `<div id="excerptContainer" style="margin-bottom: var(--space-6);">`;
          html += `<div style="font-weight: 500; margin-bottom: var(--space-2); color: var(--gvx-fg);">Source Excerpt</div>`;
          html += `<div class="excerpt-pane" id="excerptPane" style="display: none;">Loading excerpt...</div>`;
          html += `</div>`;
        }

        // Comment section
        html += `<div class="comment-section">`;
        html += `<label for="commentBox">Comment</label>`;
        html += `<textarea id="commentBox" class="comment-box" placeholder="Add your observation about this function..."></textarea>`;
        html += `</div>`;

        // Copy feedback button
        html += `<button type="button" id="copyFeedbackBtn" class="copy-btn">Copy Feedback</button>`;
        html += `<div id="copyFeedback" class="copy-feedback"></div>`;

        // Hidden textarea for clipboard fallback
        html += `<textarea id="clipboardFallback" class="hidden-textarea"></textarea>`;

        if (fn.disabled) {
          html += `<div style="color: var(--gvx-red); padding: var(--space-3); background: var(--gvx-bg); border: 1px solid var(--gvx-red); border-radius: var(--radius-chip);">
            <strong>Disabled:</strong> ${escapeHtml(fn.disabledReason)}
          </div>`;
        }

        html += `<form id="inputForm">`;
        if (inputs.length === 0) {
          html += `<p style="color: var(--gvx-gray);">No inputs required.</p>`;
        } else {
          for (const input of inputs) {
            html += `<div class="form-group">`;
            html += `<label>
              ${escapeHtml(input.name)}
              ${input.description ? `<span class="desc">${escapeHtml(input.description)}</span>` : ''}
            </label>`;

            const hasDefault = input.default !== undefined;
            if (input.type === 'string') {
              const value = hasDefault ? String(input.default) : '';
              html += `<input type="text" name="${escapeHtml(input.name)}" value="${escapeHtml(value)}" />`;
            } else if (input.type === 'number') {
              const value = hasDefault ? String(input.default) : '';
              html += `<input type="number" name="${escapeHtml(input.name)}" value="${escapeHtml(value)}" />`;
            } else if (input.type === 'json') {
              const value = hasDefault ? JSON.stringify(input.default) : '';
              html += `<textarea name="${escapeHtml(input.name)}">${escapeHtml(value)}</textarea>`;
            } else if (input.type === 'file') {
              const value = hasDefault ? String(input.default) : '';
              html += `<input type="text" name="${escapeHtml(input.name)}" value="${escapeHtml(value)}" placeholder="file path" />`;
            }
            html += `</div>`;
          }
        }
        html += `<button type="submit" class="submit-btn" ${fn.disabled ? 'disabled' : ''}>Invoke</button>`;
        html += `</form>`;

        html += `</div>`;
        html += `<div class="output-pane" id="outputPane">`;
        html += renderNotebook(selectedFunction.id);
        html += `</div>`;
        html += `</div>`;
      } else {
        html += `<div class="empty-state"><p>Select a function to invoke.</p></div>`;
      }

      content.innerHTML = html;

      content.querySelectorAll('.tab-button[data-group-name]').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedGroup = btn.getAttribute('data-group-name');
          selectedFunction = null;
          render();
        });
      });

      content.querySelectorAll('.tab-button[data-fn-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const fnId = btn.getAttribute('data-fn-id');
          selectedFunction = groups[selectedGroup].find(f => f.id === fnId);
          render();
        });
      });

      const form = document.getElementById('inputForm');
      if (form && !selectedFunction.disabled) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          await invokeFunction();
        });
      }

      // Load excerpt if function has location
      if (selectedFunction && selectedFunction.location && selectedFunction.location.file) {
        loadExcerpt(selectedFunction.location);
      }

      // Setup copy feedback button
      const copyBtn = document.getElementById('copyFeedbackBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          await copyFeedback();
        });
      }

      // Attach event listeners to cell control buttons
      attachCellEventListeners();
    }

    // Defensive wrapper around composeDecisionBlock (bin/microworld-dashboard/decision-block.js,
    // injected into this page by server.js): a validation failure (bad id,
    // missing timestamp, unknown kind) becomes a rendered warning instead of
    // an unhandled exception.
    function safeCompose(kind, context) {
      try {
        return composeDecisionBlock(kind, context);
      } catch (err) {
        return { kind: 'command', text: null, warnings: [err.message] };
      }
    }

    function renderDecisionViewHtml() {
      const { kind, key } = selectedDecisionView;
      if (kind === 'escalation') {
        const entry = decisions.escalations.find(e => e.taskId === key);
        return entry ? renderEscalationView(entry) : `<div class="empty-state"><p>Escalation not found.</p></div>`;
      }
      if (kind === 'briefing') {
        const entry = decisions.briefings.find(b => b.path === key);
        return entry ? renderBriefingView(entry) : `<div class="empty-state"><p>Briefing not found.</p></div>`;
      }
      if (kind === 'findings') {
        const entry = decisions.findings.find(f => f.slug === key);
        return entry ? renderFindingsView(entry) : `<div class="empty-state"><p>Findings not found.</p></div>`;
      }
      if (kind === 'pending-review') {
        const entry = decisions.pendingReview.find(p => p.agentId === key);
        return entry ? renderPendingReviewView(entry) : `<div class="empty-state"><p>Pending review entry not found.</p></div>`;
      }
      return '';
    }

    function attachDecisionViewListeners() {
      const { kind, key } = selectedDecisionView;
      if (kind === 'escalation') attachEscalationListeners(key);
      else if (kind === 'findings') attachFindingsListeners(key);
      else if (kind === 'pending-review') attachPendingReviewListeners(key);
      else if (kind === 'briefing') loadBriefingExcerpt(key);
    }

    // Touchpoint 1: ESCALATE-TO-HUMAN resolution. Reads the packet body,
    // composes the DECISION command from the current route/reason/by fields.
    function renderEscalationView(entry) {
      const composed = safeCompose('escalation-decision', {
        taskId: entry.taskId,
        route: escalationForm.route,
        escalationTimestamp: entry.timestamp,
        by: escalationForm.by,
        reason: escalationForm.reason,
        quiz: escalationForm.quiz,
      });

      let html = `<div style="padding: var(--space-6);">`;
      html += `<h2>Escalation: ${escapeHtml(entry.taskId)}</h2>`;

      // Reading order per gh375 Step 14: CHANGES.md, then PACKET.md, then
      // QUIZ.md -- each labelled, each omitted entirely (not an empty pane)
      // when its body is null.
      if (entry.changesBody !== null && entry.changesBody !== undefined) {
        html += `<div class="output-label">CHANGES.md</div>`;
        html += `<div class="doc-pane">${renderMarkdown(entry.changesBody)}</div>`;
      }

      html += `<div class="output-label">PACKET.md</div>`;
      html += entry.packetMissing
        ? `<p style="color: var(--gvx-gray);">(no packet found for this escalation)</p>`
        : `<div class="doc-pane">${renderMarkdown(entry.packetBody || '')}</div>`;

      if (entry.quizBody !== null && entry.quizBody !== undefined) {
        html += `<div class="output-label">QUIZ.md</div>`;
        html += `<div class="doc-pane">${renderMarkdown(entry.quizBody)}</div>`;
        // The reveal pane is deliberately absent from this markup -- it is
        // populated on demand, on click, via GET /api/source (R6: never
        // shipped in the /api/decisions payload, never pre-rendered hidden).
        html += `<button type="button" id="quizRevealBtn" class="copy-btn">Reveal answer key</button>`;
        html += `<div id="quizAnswerContainer"></div>`;
      }

      html += `<div class="form-group"><label>Route</label>
        <div class="pill-option-group" role="radiogroup" aria-label="Route">
          <button type="button" role="radio" aria-checked="${escalationForm.route === 'approve'}" id="routeOption-approve" class="pill-option ${escalationForm.route === 'approve' ? 'checked' : ''}">approve</button>
          <button type="button" role="radio" aria-checked="${escalationForm.route === 'reject'}" id="routeOption-reject" class="pill-option ${escalationForm.route === 'reject' ? 'checked' : ''}">reject</button>
          <button type="button" role="radio" aria-checked="${escalationForm.route === 'direct'}" id="routeOption-direct" class="pill-option ${escalationForm.route === 'direct' ? 'checked' : ''}">direct</button>
        </div></div>`;
      if (escalationForm.route === 'approve') {
        html += `<div class="form-group"><label>Quiz</label>
          <div class="pill-option-group" role="radiogroup" aria-label="Quiz">
            <button type="button" role="radio" aria-checked="${escalationForm.quiz === 'skipped'}" id="quizOption-skipped" class="pill-option ${escalationForm.quiz === 'skipped' ? 'checked' : ''}">skipped</button>
            <button type="button" role="radio" aria-checked="${escalationForm.quiz === 'passed-self-check'}" id="quizOption-passed-self-check" class="pill-option ${escalationForm.quiz === 'passed-self-check' ? 'checked' : ''}">passed-self-check</button>
            <button type="button" role="radio" aria-checked="${escalationForm.quiz === 'none-offered'}" id="quizOption-none-offered" class="pill-option ${escalationForm.quiz === 'none-offered' ? 'checked' : ''}">none-offered</button>
          </div></div>`;
      }
      html += `<div class="form-group"><label>Reason</label><textarea id="escalationReason">${escapeHtml(escalationForm.reason)}</textarea></div>`;
      html += `<div class="form-group"><label>Name (by)</label><input type="text" id="escalationBy" value="${escapeHtml(escalationForm.by)}" /></div>`;

      html += `<div class="output-label">Composed command</div>`;
      html += composed.text
        ? `<div class="excerpt-pane">${escapeHtml(composed.text)}</div><button type="button" id="decisionCopyBtn" class="copy-btn">Copy Command</button>`
        : `<div style="color: var(--gvx-gray);">${escapeHtml((composed.warnings || []).join(' '))}</div>`;
      html += `<div id="decisionCopyFeedback" class="copy-feedback"></div>`;
      html += `<textarea id="decisionClipboardFallback" class="hidden-textarea"></textarea>`;
      html += `</div>`;
      return html;
    }

    function attachEscalationListeners(taskId) {
      const entry = decisions.escalations.find(e => e.taskId === taskId);
      if (!entry) return;

      // Route option buttons
      ['approve', 'reject', 'direct'].forEach(route => {
        const btn = document.getElementById(`routeOption-${route}`);
        if (btn) btn.addEventListener('click', () => { escalationForm.route = route; renderContent(); });
      });

      // Quiz option buttons (only attached if rendered)
      ['skipped', 'passed-self-check', 'none-offered'].forEach(quiz => {
        const btn = document.getElementById(`quizOption-${quiz}`);
        if (btn) btn.addEventListener('click', () => { escalationForm.quiz = quiz; renderContent(); });
      });

      const reasonTa = document.getElementById('escalationReason');
      if (reasonTa) reasonTa.addEventListener('change', () => { escalationForm.reason = reasonTa.value; renderContent(); });
      const byInput = document.getElementById('escalationBy');
      if (byInput) byInput.addEventListener('change', () => { escalationForm.by = byInput.value; renderContent(); });

      const copyBtn = document.getElementById('decisionCopyBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          const composed = safeCompose('escalation-decision', {
            taskId: entry.taskId,
            route: escalationForm.route,
            escalationTimestamp: entry.timestamp,
            by: escalationForm.by,
            reason: escalationForm.reason,
            quiz: escalationForm.quiz,
          });
          if (composed.text) await doCopyDecision(composed.text);
        });
      }

      const revealBtn = document.getElementById('quizRevealBtn');
      if (revealBtn) {
        revealBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          await loadQuizAnswerKey(entry.taskId);
        });
      }
    }

    // R6 discipline: QUIZ-ANSWERS.md reaches the browser only as the direct
    // result of this click handler running -- it is never part of the
    // /api/decisions payload (see decisions.js) and never named by
    // decision-block.js. Reuses the same /api/source excerpt shape
    // loadBriefingExcerpt already uses in this section; a failed/404 fetch
    // renders the same inline-error treatment, never a throw.
    async function loadQuizAnswerKey(taskId) {
      const container = document.getElementById('quizAnswerContainer');
      if (container) container.innerHTML = `<div class="excerpt-pane">Loading answer key...</div>`;
      try {
        const response = await fetch(
          `/api/source?file=${encodeURIComponent(`.claude/human-review/${taskId}/QUIZ-ANSWERS.md`)}&startLine=1&endLine=400`,
          { headers: token ? { 'X-Antislop-Token': token } : {} }
        );
        if (!response.ok) {
          const error = await response.json();
          if (container) container.innerHTML = `<div class="excerpt-pane">Error: ${escapeHtml(error.error || 'Cannot load answer key')}</div>`;
          return;
        }
        const data = await response.json();
        const lines = data.lines || [];
        const content = lines.join('\n');
        let html = `<div class="doc-pane">${renderMarkdown(content)}</div>`;
        if (data.totalLines > data.endLine) {
          html += `<div style="color: var(--gvx-gray); font-size: 0.85rem; margin-top: var(--space-2);">Truncated at line ${data.endLine} of ${data.totalLines}</div>`;
        }
        if (container) container.innerHTML = html;
      } catch (err) {
        if (container) container.innerHTML = `<div class="excerpt-pane">Error loading answer key: ${escapeHtml(err.message)}</div>`;
      }
    }

    // Touchpoint 2: plan-doc excerpt browser. Read-only (D-4) -- no control
    // here ever submits an answer; this view only renders the plan doc
    // excerpt via GET /api/source and the currently known units' pass/fail
    // markers (reusing the already-fetched /api/bundles data, since
    // /api/decisions carries no unit list).
    function renderBriefingView(briefing) {
      let html = `<div style="padding: var(--space-6);">`;
      html += `<h2>Plan excerpt: ${escapeHtml(briefing.heading || briefing.path)}</h2>`;
      html += `<p style="color: var(--gvx-gray); font-size: 0.85rem;">${escapeHtml(briefing.path)}</p>`;
      html += `<div class="output-label">Goal / assumptions / Open Questions excerpt</div>`;
      html += `<div class="excerpt-pane" id="briefingExcerptPane">Loading excerpt...</div>`;
      html += renderMilestoneUnits();
      html += `</div>`;
      return html;
    }

    function renderMilestoneUnits() {
      const workingBundles = bundles.filter(b => b.source === 'working');
      if (workingBundles.length === 0) return '';
      let html = `<div class="output-label" style="margin-top: var(--space-4);">Units</div>`;
      html += workingBundles.map(b => `
        <div><span class="status-indicator ${getStatusClass(b.status)}"></span>${escapeHtml(b.unit)}</div>
      `).join('');
      return html;
    }

    async function loadBriefingExcerpt(filePath) {
      const pane = document.getElementById('briefingExcerptPane');
      try {
        const response = await fetch(
          `/api/source?file=${encodeURIComponent(filePath)}&startLine=1&endLine=400`,
          { headers: token ? { 'X-Antislop-Token': token } : {} }
        );
        if (!response.ok) {
          const error = await response.json();
          if (pane) pane.textContent = `Error: ${error.error || 'Cannot load excerpt'}`;
          return;
        }
        const data = await response.json();
        const lines = data.lines || [];
        const content = lines.join('\n');
        let html = `<div class="doc-pane">${renderMarkdown(content)}</div>`;
        if (data.totalLines > data.endLine) {
          html += `<div style="color: var(--gvx-gray); font-size: 0.85rem; margin-top: var(--space-2);">Truncated at line ${data.endLine} of ${data.totalLines}</div>`;
        }
        if (pane) pane.innerHTML = html;
      } catch (err) {
        if (pane) pane.textContent = `Error loading excerpt: ${err.message}`;
      }
    }

    // Touchpoint 3: milestone-auditor findings relay. Composes a paste-back
    // markdown block (D-3), not a command.
    function renderFindingsView(finding) {
      const composed = safeCompose('milestone-findings-response', {
        planSlug: finding.slug,
        findingsText: finding.body,
      });

      let html = `<div style="padding: var(--space-6);">`;
      html += `<h2>Milestone findings: ${escapeHtml(finding.slug)}</h2>`;
      html += finding.malformed
        ? `<p style="color: var(--gvx-red);">Malformed findings record: ${escapeHtml(finding.malformedReason || '')}</p>`
        : `<p style="color: var(--gvx-gray); font-size: 0.85rem;">count: ${escapeHtml(String(finding.count))} · ${escapeHtml(finding.timestamp || '')}</p>`;
      html += `<div class="doc-pane">${renderMarkdown(finding.body)}</div>`;

      html += `<div class="output-label">Paste-back block</div>`;
      html += composed.text
        ? `<div class="excerpt-pane">${escapeHtml(composed.text)}</div><button type="button" id="decisionCopyBtn" class="copy-btn">Copy Block</button>`
        : `<div style="color: var(--gvx-gray);">${escapeHtml((composed.warnings || []).join(' '))}</div>`;
      html += `<div id="decisionCopyFeedback" class="copy-feedback"></div>`;
      html += `<textarea id="decisionClipboardFallback" class="hidden-textarea"></textarea>`;
      html += `</div>`;
      return html;
    }

    function attachFindingsListeners(slug) {
      const entry = decisions.findings.find(f => f.slug === slug);
      if (!entry) return;

      const copyBtn = document.getElementById('decisionCopyBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          const composed = safeCompose('milestone-findings-response', { planSlug: entry.slug, findingsText: entry.body });
          if (composed.text) await doCopyDecision(composed.text);
        });
      }
    }

    // Touchpoint 4: pending-review defer/skip. D-5's guard is rendered
    // unconditionally -- the skip consequence text is shown regardless of
    // whether a reason has been typed yet, since it is a static warning
    // about what the skip command does, not a preview of a composed value.
    function renderPendingReviewView(entry) {
      const deferComposed = safeCompose('pending-review-defer', { agentId: entry.agentId, reason: pendingReviewForm.reason });
      const skipComposed = safeCompose('pending-review-skip', { agentId: entry.agentId, reason: pendingReviewForm.reason });
      const skipConsequence = safeCompose('pending-review-skip', { agentId: entry.agentId, reason: 'placeholder' }).consequence || '';

      let html = `<div style="padding: var(--space-6);">`;
      html += `<h2>Pending review: ${escapeHtml(entry.unit || entry.agentId)}</h2>`;
      html += `<p>agent: ${escapeHtml(entry.agentId)}</p>`;
      html += `<p>state: ${escapeHtml(entry.state)}</p>`;
      html += `<p>since: ${escapeHtml(entry.timestamp || '(unavailable)')}</p>`;
      if (entry.reason) html += `<p>deferred reason: ${escapeHtml(entry.reason)}</p>`;

      html += `<div class="form-group"><label>Reason (for defer/skip)</label><textarea id="pendingReviewReason">${escapeHtml(pendingReviewForm.reason)}</textarea></div>`;

      html += `<div class="output-label">Defer command</div>`;
      html += deferComposed.text
        ? `<div class="excerpt-pane">${escapeHtml(deferComposed.text)}</div><button type="button" id="deferCopyBtn" class="copy-btn">Copy Defer Command</button>`
        : `<div style="color: var(--gvx-gray);">${escapeHtml((deferComposed.warnings || []).join(' '))}</div>`;

      html += `<div class="output-label" style="margin-top: var(--space-4);">Skip command</div>`;
      html += `<div style="color: var(--gvx-red);">${escapeHtml(skipConsequence)}</div>`;
      html += skipComposed.text
        ? `<div class="excerpt-pane">${escapeHtml(skipComposed.text)}</div><button type="button" id="skipCopyBtn" class="copy-btn">Copy Skip Command</button>`
        : `<div style="color: var(--gvx-gray);">${escapeHtml((skipComposed.warnings || []).join(' '))}</div>`;

      html += `<div id="decisionCopyFeedback" class="copy-feedback"></div>`;
      html += `<textarea id="decisionClipboardFallback" class="hidden-textarea"></textarea>`;
      html += `</div>`;
      return html;
    }

    function attachPendingReviewListeners(agentId) {
      const entry = decisions.pendingReview.find(p => p.agentId === agentId);
      if (!entry) return;

      const reasonTa = document.getElementById('pendingReviewReason');
      if (reasonTa) reasonTa.addEventListener('change', () => { pendingReviewForm.reason = reasonTa.value; renderContent(); });

      const deferBtn = document.getElementById('deferCopyBtn');
      if (deferBtn) {
        deferBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          const composed = safeCompose('pending-review-defer', { agentId: entry.agentId, reason: pendingReviewForm.reason });
          if (composed.text) await doCopyDecision(composed.text);
        });
      }

      const skipBtn = document.getElementById('skipCopyBtn');
      if (skipBtn) {
        skipBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          const composed = safeCompose('pending-review-skip', { agentId: entry.agentId, reason: pendingReviewForm.reason });
          if (composed.text) await doCopyDecision(composed.text);
        });
      }
    }

    // Copies pre-composed decision text to the clipboard. Unlike
    // doCopyFeedback, this never fetches anything (a composed decision
    // command/block needs no git SHA) -- purely local, so no decision-surface
    // interaction can ever issue a network request (R1).
    async function doCopyDecision(text, feedbackDivId = 'decisionCopyFeedback', fallbackId = 'decisionClipboardFallback') {
      try {
        await writeClipboardText(text, feedbackDivId, fallbackId);
      } catch (err) {
        console.error('Error copying decision text:', err);
        showCopyFeedback(feedbackDivId, 'Error: ' + err.message);
      }
    }

    function renderNotebook(functionId) {
      const cells = cellsByFunctionId[functionId] || [];
      let html = '';

      // Shared state warning
      html += `<div style="padding: var(--space-4); background: var(--gvx-bg); border: 1px solid var(--gvx-green); border-radius: var(--radius-chip); margin-bottom: var(--space-6);">
        <div style="font-weight: 500; color: var(--gvx-green); margin-bottom: var(--space-2);">each cell runs in a fresh process</div>
        <div style="font-size: 0.9rem; color: var(--gvx-fg);">Cell executions are independent. Cell 2 cannot see variables or state from Cell 1.</div>
      </div>`;

      if (cells.length === 0) {
        html += `<div style="color: var(--gvx-gray); font-style: italic;">No cells yet. Invoke the function above to create one.</div>`;
        return html;
      }

      html += `<div style="font-weight: 500; color: var(--gvx-fg); margin-bottom: var(--space-4);">Execution History (${cells.length} ${cells.length === 1 ? 'cell' : 'cells'})</div>`;

      for (let i = cells.length - 1; i >= 0; i--) {
        const cell = cells[i];
        const isCollapsed = cell.collapsed === true;
        html += renderCell(cell, functionId, i, isCollapsed);
      }

      return html;
    }

    function renderCell(cell, functionId, index, isCollapsed) {
      const startedTime = new Date(cell.startedAt).toLocaleTimeString();
      let html = `<div style="margin-bottom: var(--space-6); border: 1px solid var(--gvx-bg-soft); border-radius: var(--radius-card); overflow: hidden; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);">`;

      // Cell header with controls
      html += `<div style="padding: var(--space-3); background: var(--gvx-bg-soft); border-bottom: 1px solid var(--gvx-bg-soft); display: flex; align-items: center; justify-content: space-between;">`;
      html += `<div style="flex: 1;">`;
      html += `<div style="font-weight: 500; color: var(--gvx-fg);">Cell ${index + 1}</div>`;
      html += `<div style="font-size: 0.85rem; color: var(--gvx-gray); margin-top: var(--space-1);">Invoked at ${escapeHtml(startedTime)}</div>`;
      html += `</div>`;

      // Control buttons
      html += `<div style="display: flex; gap: var(--space-2);">`;
      html += `<button class="cell-edit-btn" data-fn-id="${escapeHtml(functionId)}" data-cell-id="${escapeHtml(cell.cellId)}" style="background: var(--gvx-blue); color: var(--gvx-bg); border: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius-chip); cursor: pointer; font-size: 0.85rem;">Edit</button>`;
      html += `<button class="cell-toggle-btn" data-fn-id="${escapeHtml(functionId)}" data-cell-id="${escapeHtml(cell.cellId)}" style="background: transparent; color: var(--gvx-fg); border: 1px solid var(--gvx-gray); padding: var(--space-2) var(--space-3); border-radius: var(--radius-chip); cursor: pointer; font-size: 0.85rem;">${isCollapsed ? 'Expand' : 'Collapse'}</button>`;
      html += `<button class="cell-remove-btn" data-fn-id="${escapeHtml(functionId)}" data-cell-id="${escapeHtml(cell.cellId)}" style="background: var(--gvx-red); color: var(--gvx-bg); border: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius-chip); cursor: pointer; font-size: 0.85rem;">Remove</button>`;
      html += `</div>`;
      html += `</div>`;

      // Cell content (output)
      if (!isCollapsed) {
        html += `<div style="padding: var(--space-4); background: var(--gvx-bg);">`;

        // Exit code
        html += `<div style="margin-bottom: var(--space-2);">`;
        html += `<div class="output-label">Exit code: <span class="exit-code">${cell.result.exitCode}</span></div>`;
        html += `</div>`;

        // Duration
        if (cell.result.durationMs !== undefined) {
          html += `<div style="margin-bottom: var(--space-2);">`;
          html += `<div class="output-label">Duration: ${cell.result.durationMs}ms</div>`;
          html += `</div>`;
        }

        // Timeout and truncation banners
        if (cell.result.timedOut) {
          html += `<div class="banner banner-timeout">Timeout: execution exceeded 60s</div>`;
        }
        if (cell.result.truncated) {
          html += `<div class="banner banner-truncated">Output truncated</div>`;
        }

        // Stdout
        if (cell.result.stdout) {
          html += `<div style="margin-bottom: var(--space-4);">`;
          html += `<div class="output-label">stdout</div>`;
          html += `<div style="background: var(--gvx-bg-dim); padding: var(--space-3); border: 1px solid var(--gvx-bg-soft); border-radius: var(--radius-chip); font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;">${escapeHtml(cell.result.stdout)}</div>`;
          html += `</div>`;
        }

        // Stderr
        if (cell.result.stderr) {
          html += `<div style="margin-bottom: var(--space-4);">`;
          html += `<div class="output-label">stderr</div>`;
          html += `<div style="background: var(--gvx-bg-dim); padding: var(--space-3); border: 1px solid var(--gvx-red); border-radius: var(--radius-chip); font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; color: var(--gvx-red); max-height: 300px; overflow-y: auto;">${escapeHtml(cell.result.stderr)}</div>`;
          html += `</div>`;
        }

        if (!cell.result.stdout && !cell.result.stderr) {
          html += `<div style="color: var(--gvx-gray);">No output</div>`;
        }

        // Per-cell comment box + copy feedback button. Ids are per-instance
        // (keyed on this cell's own cellId, which is unique page-wide), not
        // hardcoded singletons, so multiple cells never collide.
        html += `<div class="comment-section">`;
        html += `<label for="cell-comment-${escapeHtml(cell.cellId)}">Comment</label>`;
        html += `<textarea id="cell-comment-${escapeHtml(cell.cellId)}" class="comment-box" placeholder="Add your observation about this run..."></textarea>`;
        html += `</div>`;
        html += `<button type="button" class="cell-copy-btn" data-fn-id="${escapeHtml(functionId)}" data-cell-id="${escapeHtml(cell.cellId)}" style="background: var(--gvx-green); color: var(--gvx-bg); border: none; padding: var(--space-3) var(--space-4); border-radius: var(--radius-pill); cursor: pointer; font-weight: 500; width: 100%;">Copy Feedback</button>`;
        html += `<div id="cell-copy-feedback-${escapeHtml(cell.cellId)}" class="copy-feedback"></div>`;
        html += `<textarea id="cell-clipboard-fallback-${escapeHtml(cell.cellId)}" class="hidden-textarea"></textarea>`;

        html += `</div>`;
      }

      html += `</div>`;
      return html;
    }

    async function invokeFunction() {
      if (!selectedBundle || !selectedFunction) return;

      const form = document.getElementById('inputForm');
      const inputs = {};

      for (const input of (selectedFunction.inputs || [])) {
        const elem = form.elements[input.name];
        if (!elem) continue;

        const val = elem.value;
        if (input.type === 'number') {
          inputs[input.name] = isNaN(val) ? null : Number(val);
        } else if (input.type === 'json') {
          try {
            inputs[input.name] = JSON.parse(val);
          } catch {
            alert('Invalid JSON for ' + input.name);
            return;
          }
        } else {
          inputs[input.name] = val;
        }
      }

      const btn = form.querySelector('button[type="submit"]');
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Running...';

      try {
        const response = await fetch('/api/invoke', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'X-Antislop-Token': token } : {}),
          },
          body: JSON.stringify({
            id: selectedBundle.id,
            functionId: selectedFunction.id,
            inputs,
          }),
        });

        const result = await response.json();
        if (!response.ok) {
          const output = document.getElementById('outputPane');
          output.innerHTML = `<div style="color: var(--gvx-red);"><strong>Error:</strong> ${escapeHtml(result.error)}</div>`;
          return;
        }

        // Create a new cell and add to notebook
        const cellId = String(nextCellId++);

        const cell = {
          cellId,
          functionId: selectedFunction.id,
          inputs,
          startedAt: new Date().toISOString(),
          result,
          collapsed: false,
        };

        if (!cellsByFunctionId[selectedFunction.id]) {
          cellsByFunctionId[selectedFunction.id] = [];
        }
        cellsByFunctionId[selectedFunction.id].push(cell);

        // Re-render the notebook
        const output = document.getElementById('outputPane');
        output.innerHTML = renderNotebook(selectedFunction.id);
        attachCellEventListeners();
      } catch (err) {
        const output = document.getElementById('outputPane');
        output.innerHTML = `<div style="color: var(--gvx-red);"><strong>Error:</strong> ${escapeHtml(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = oldText;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function init() {
      // Fetch context (userName for defaultBy) non-fatally
      try {
        const contextResponse = await fetch('/api/context', {
          headers: token ? { 'X-Antislop-Token': token } : {},
        });
        if (contextResponse.ok) {
          const contextData = await contextResponse.json();
          defaultBy = contextData.userName || '';
        }
      } catch (err) {
        // Non-fatal: fetch failure or thrown error leaves defaultBy = ''
      }
      // Initialize escalationForm with defaultBy
      escalationForm = { route: 'approve', reason: '', by: defaultBy, quiz: 'skipped' };

      await Promise.all([refreshBundles(), refreshDecisions()]);
      // Priority order: escalations → working bundles → briefings → findings → pending review
      if (decisions && decisions.escalations && decisions.escalations.length > 0) {
        selectedDecisionView = { kind: 'escalation', key: decisions.escalations[0].taskId };
        resetDecisionForms();
      } else if (bundles.length > 0) {
        selectedBundle = bundles[0];
        if (selectedBundle.functions && selectedBundle.functions.length > 0) {
          selectedFunction = selectedBundle.functions[0];
        }
      } else {
        autoSelectDecisionView();
      }
      render();
      setInterval(pollBundles, 5000);
    }

    // With no microworld bundle to show by default, surface the first
    // available decision touchpoint instead of an empty state. Priority
    // order matches the touchpoint numbering in the parent spec.
    function autoSelectDecisionView() {
      if (!decisions) return;
      if (decisions.escalations.length > 0) {
        selectedDecisionView = { kind: 'escalation', key: decisions.escalations[0].taskId };
      } else if (decisions.briefings.length > 0) {
        selectedDecisionView = { kind: 'briefing', key: decisions.briefings[0].path };
      } else if (decisions.findings.length > 0) {
        selectedDecisionView = { kind: 'findings', key: decisions.findings[0].slug };
      } else if (decisions.pendingReview.length > 0) {
        selectedDecisionView = { kind: 'pending-review', key: decisions.pendingReview[0].agentId };
      } else {
        return;
      }
      resetDecisionForms();
    }

    async function pollBundles() {
      await Promise.all([refreshBundles(), refreshDecisions()]);
      if (selectedBundle) {
        selectedBundle = bundles.find(b => b.id === selectedBundle.id) || selectedBundle;
      }
      renderLeftRail();
    }

    function attachCellEventListeners() {
      if (!document.querySelectorAll) return; // Skip in test environment without full DOM

      // Edit and re-run button
      document.querySelectorAll('.cell-edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cellId = btn.getAttribute('data-cell-id');
          const fnId = btn.getAttribute('data-fn-id');
          const cells = cellsByFunctionId[fnId] || [];
          const cell = cells.find(c => c.cellId === cellId);
          if (!cell) return;

          // Prefill form from cell inputs
          const form = document.getElementById('inputForm');
          if (!form) return;

          for (const input of (selectedFunction.inputs || [])) {
            const elem = form.elements[input.name];
            if (!elem) continue;

            const val = cell.inputs[input.name];
            if (input.type === 'json') {
              elem.value = typeof val === 'string' ? val : JSON.stringify(val);
            } else {
              elem.value = val !== undefined ? String(val) : '';
            }
          }
        });
      });

      // Collapse/expand button
      document.querySelectorAll('.cell-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cellId = btn.getAttribute('data-cell-id');
          const fnId = btn.getAttribute('data-fn-id');
          const cells = cellsByFunctionId[fnId] || [];
          const cell = cells.find(c => c.cellId === cellId);
          if (!cell) return;

          cell.collapsed = !cell.collapsed;
          const output = document.getElementById('outputPane');
          output.innerHTML = renderNotebook(fnId);
          attachCellEventListeners();
        });
      });

      // Per-cell copy feedback button
      document.querySelectorAll('.cell-copy-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          const cellId = btn.getAttribute('data-cell-id');
          const fnId = btn.getAttribute('data-fn-id');
          await copyCellFeedback(fnId, cellId);
        });
      });

      // Remove button
      document.querySelectorAll('.cell-remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cellId = btn.getAttribute('data-cell-id');
          const fnId = btn.getAttribute('data-fn-id');
          const cells = cellsByFunctionId[fnId] || [];
          const idx = cells.findIndex(c => c.cellId === cellId);
          if (idx >= 0) {
            cells.splice(idx, 1);
          }

          const output = document.getElementById('outputPane');
          output.innerHTML = renderNotebook(fnId);
          attachCellEventListeners();
        });
      });
    }

    async function loadExcerpt(location) {
      const excerptPane = document.getElementById('excerptPane');
      if (!excerptPane) return;

      try {
        const response = await fetch(
          `/api/source?file=${encodeURIComponent(location.file)}&startLine=${location.startLine || 1}&endLine=${location.endLine || 100}`,
          { headers: token ? { 'X-Antislop-Token': token } : {} }
        );

        if (!response.ok) {
          const error = await response.json();
          excerptPane.textContent = `Error: ${error.error || 'Cannot load excerpt'}`;
          excerptPane.style.display = 'block';
          return;
        }

        const data = await response.json();
        const lines = data.lines || [];
        const actualStartLine = data.startLine || location.startLine;

        let html = '';
        lines.forEach((line, idx) => {
          const lineNum = actualStartLine + idx;
          html += `<div class="excerpt-line"><span style="color: var(--gvx-gray); margin-right: var(--space-2);">${lineNum}</span>${escapeHtml(line)}</div>`;
        });

        excerptPane.innerHTML = html;
        excerptPane.style.display = 'block';
      } catch (err) {
        excerptPane.textContent = `Error loading excerpt: ${err.message}`;
        excerptPane.style.display = 'block';
      }
    }

    // Function-scoped copy: no cell means no "### Last run" section (that
    // section is reserved for a copy that came from a specific cell).
    async function copyFeedback() {
      if (!selectedBundle || !selectedFunction) return;

      const commentBox = document.getElementById('commentBox');
      const comment = commentBox ? commentBox.value : '';

      await doCopyFeedback({
        comment,
        cell: null,
        feedbackDivId: 'copyFeedback',
        fallbackId: 'clipboardFallback',
      });
    }

    // Cell-scoped copy: "### Last run" is sourced from THIS specific cell's
    // own inputs/result -- not "the last cell for this function".
    async function copyCellFeedback(functionId, cellId) {
      if (!selectedBundle || !selectedFunction) return;

      const cells = cellsByFunctionId[functionId] || [];
      const cell = cells.find(c => c.cellId === cellId);
      if (!cell) return;

      const commentBox = document.getElementById(`cell-comment-${cellId}`);
      const comment = commentBox ? commentBox.value : '';

      await doCopyFeedback({
        comment,
        cell,
        feedbackDivId: `cell-copy-feedback-${cellId}`,
        fallbackId: `cell-clipboard-fallback-${cellId}`,
      });
    }

    // Shared clipboard mechanics + feedback-block assembly for both the
    // function-scoped and cell-scoped copy buttons. Delegates the actual
    // markdown shape to formatFeedbackBlock (bin/microworld-dashboard/feedback-block.js,
    // injected into this page by server.js) -- the single implementation of
    // that shape, not a hand-maintained duplicate.
    // Shared clipboard mechanics: clipboard API first, hidden-textarea +
    // execCommand fallback second. Used by doCopyFeedback (function/cell
    // feedback) and doCopyDecision (gh353's Decisions section) alike, so
    // there is one implementation of the fallback path, not two.
    async function writeClipboardText(text, feedbackDivId, fallbackId) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          showCopyFeedback(feedbackDivId, 'Copied to clipboard!');
          return;
        }
      } catch (err) {
        console.warn('Clipboard API failed, using fallback:', err);
      }

      const fallback = document.getElementById(fallbackId);
      if (fallback) {
        fallback.value = text;
        fallback.select();
        try {
          const success = document.execCommand('copy');
          if (success) {
            showCopyFeedback(feedbackDivId, 'Copied to clipboard!');
            return;
          }
        } catch (err) {
          console.warn('execCommand fallback failed:', err);
        }
      }

      showCopyFeedback(feedbackDivId, 'Copy failed - please try again');
    }

    async function doCopyFeedback({ comment, cell, feedbackDivId, fallbackId }) {
      try {
        // Get git SHA from /api/context
        const contextResponse = await fetch('/api/context', {
          headers: token ? { 'X-Antislop-Token': token } : {},
        });

        if (!contextResponse.ok) {
          throw new Error('Failed to get commit SHA');
        }

        const contextData = await contextResponse.json();
        const sha = contextData.sha;

        const feedback = formatFeedbackBlock({
          unitSlug: selectedBundle.unit,
          functionId: selectedFunction.id,
          functionGroup: selectedFunction.group,
          functionLabel: selectedFunction.label || selectedFunction.id,
          comment,
          sha,
          location: (selectedFunction.location && selectedFunction.location.file) ? selectedFunction.location : null,
          cell: cell ? { inputs: cell.inputs, result: cell.result } : null,
        });

        await writeClipboardText(feedback, feedbackDivId, fallbackId);
      } catch (err) {
        console.error('Error copying feedback:', err);
        showCopyFeedback(feedbackDivId, 'Error: ' + err.message);
      }
    }

    function showCopyFeedback(feedbackDivId, message) {
      const feedbackDiv = document.getElementById(feedbackDivId);
      if (feedbackDiv) {
        feedbackDiv.textContent = message;
        feedbackDiv.style.display = 'block';
        setTimeout(() => {
          feedbackDiv.style.display = 'none';
        }, 3000);
      }
    }

    function render() {
      renderLeftRail();
      renderContent();
    }

    init();
  </script>
</body>
