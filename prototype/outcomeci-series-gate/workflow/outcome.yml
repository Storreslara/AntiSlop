# Zero-API trial workflow (D3): no secrets, apis, can or policy, so no broker call is made.
# Cheapest current model for a one-line summary; the claude runner profile keeps it keyless (subscription token).
apiVersion: outcomeci.workflow/v1
name: series-gate-trial
trigger: manual

reasoning:
  default: {runner: claude, model: claude-haiku-4-5}

steps:
  - summarize:
      reason: summarize.md
      from: trigger
      returns:
        summary: string
